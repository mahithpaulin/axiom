name: axiom CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public repo: Actions minutes are free, but each job caps at 6h.
# So work is split by step budgets + deterministic counters (DD-0016),
# never by wall-clock cutoffs. Quick + diag only in CI; full scaling
# (n=20000, O(n^3) until I1 is fixed) is manual via scaling.yml.
#
# NEVER use `cargo test --all-targets` here: it includes `--benches`, and
# with `harness = false` cargo executes the bench's main() as its test
# binary — the full suite including tc_path_n20000 in the debug profile.
# Diagnosed 2026-10-03: hung the job for the full timeout with no output.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit + integration (80 pass, 2 ignored)
        run: cargo test --lib --tests

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: doc tests (shell timeout so a hang fails fast with signal)
        run: timeout 300 cargo test --doc

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings, lib + tests only)
        run: cargo clippy --lib --tests -- -D warnings

  known-defects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: confirm no ignored tests remain (I5/I6 un-ignored after fix)
        run: cargo test -- --ignored

  bench-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CI bench subset (quick sizes, no scaling table)
        run: cargo bench --bench kernel -- ci

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: I1 scaling probe (n=100..800, candidates slope must go 3 -> 2)
        run: cargo bench --bench kernel -- diag
