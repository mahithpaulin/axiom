name: axiom scaling (manual, heavy)

on:
  workflow_dispatch:

# Full suite including tc_path_n20000 + tc_random + memory.
# Do NOT run until I1 (0.5n^3) is fixed -- it will burn the 6h job cap.
# Trigger by hand from the Actions tab after each I-fix.
jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: full kernel bench (all sizes)
        run: cargo bench --bench kernel
