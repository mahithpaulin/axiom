[package]
name = "axiom-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RatatuI chat client that calls any OpenAI-compatible or Anthropic agent with Axiom as a local reasoning tool."
license = "MIT OR Apache-2.0"

[[bin]]
name = "axiom-tui"
path = "src/main.rs"

[dependencies]
axiom = { path = "../.." }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = true }
